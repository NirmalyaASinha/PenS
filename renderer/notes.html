<div id="notes-view" style="display: none; padding: 20px; height: 100%; box-sizing: border-box; flex-direction: column;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h1 style="font-family: var(--font-sketch);">My notes</h1>
    <input type="text" id="notes-search" placeholder="Search notes..." style="padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border-color); width: 300px;">
  </div>
  
  <div style="display: flex; gap: 10px; margin-bottom: 20px;">
    <button id="notes-sort-recent" class="filter-btn active">Recent</button>
    <button id="notes-sort-name" class="filter-btn">Name</button>
    <button id="notes-filter-web" class="filter-btn">Web</button>
    <button id="notes-filter-pdf" class="filter-btn">PDF</button>
  </div>

  <div id="notes-list-container" style="flex: 1; overflow-y: auto;">
    <ol id="notes-list" style="list-style-type: decimal; padding-left: 20px; margin: 0; display: flex; flex-direction: column; gap: 10px;">
      <!-- Notes listed here -->
    </ol>
  </div>
</div>

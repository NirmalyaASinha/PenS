<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PenS</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div id="app">
    <!-- Custom Titlebar and Tabs -->
    <div id="titlebar">
      <div id="tabs-container">
        <!-- Tabs injected here -->
        <button id="new-tab-btn" title="New Tab (Ctrl+T)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
      </div>
      <div class="drag-region"></div>
    </div>

    <!-- Modern Toolbar -->
    <header id="toolbar">
      <div class="nav-group">
        <button id="btn-back" title="Back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </button>
        <button id="btn-forward" title="Forward">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
        <button id="btn-reload" title="Reload">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        </button>
      </div>

      <div class="address-bar-container">
        <svg class="url-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
        <input type="text" id="address-bar" placeholder="Search Google or enter web address..." />
        <button id="btn-save-toggle" class="save-toggle" title="Keep notes for this website (Off - Click to save for next visit)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
        </button>
      </div>

      <div class="nav-group">
        <button id="btn-zoom-out" title="Zoom Out (Ctrl+Minus)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
        </button>
        <button id="btn-zoom-in" title="Zoom In (Ctrl+Plus)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
        </button>
      </div>

      <div class="nav-group">
        <button id="btn-snapshot" class="primary-btn" title="Snapshot to PDF" style="background-color: #34a853;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
          <span>Snap</span>
        </button>
        <button id="btn-open-pdf" class="primary-btn" title="Open PDF">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
          <span>PDF</span>
        </button>
        <button id="btn-pdf-text" class="primary-btn pdf-only-control" title="Add text comment to PDF">T</button>
        <button id="btn-pdf-save" class="primary-btn pdf-only-control" title="Save PDF annotations">Save</button>
      </div>

      <div class="mode-group">
        <button id="btn-mode" class="mode-auto" title="Cycle Modes (P)">Auto</button>
      </div>
      <div class="toolbar-actions">
        <button id="btn-shields" class="toolbar-icon-btn" title="Privacy Shields">🛡</button>
        <button id="btn-downloads" class="toolbar-icon-btn" title="Downloads">↓</button>
        <button id="btn-menu" class="toolbar-icon-btn" title="Menu" aria-label="Customize and control PenS">⋮</button>
        <div id="app-menu" class="app-menu" style="display: none;">
          <div class="app-menu-title">Customize and control PenS</div>
          <button data-menu-action="new-tab">▣ <span>New tab</span><kbd>Ctrl+T</kbd></button>
          <button data-menu-action="new-window">□ <span>New window</span><kbd>Ctrl+N</kbd></button>
          <button data-menu-action="history">◷ <span>History</span><span class="menu-arrow">›</span></button>
          <button data-menu-action="downloads">↓ <span>Downloads</span><kbd>Ctrl+J</kbd></button>
          <button data-menu-action="bookmarks">☆ <span>Bookmarks and lists</span><span class="menu-arrow">›</span></button>
          <button data-menu-action="clear-data">♜ <span>Delete browsing data...</span><kbd>Ctrl+Shift+Del</kbd></button>
          <div class="app-menu-separator"></div>
          <div class="app-menu-zoom"><span>⌕ <span>Zoom</span></span><button data-menu-action="zoom-out">−</button><strong id="menu-zoom-value">100%</strong><button data-menu-action="zoom-in">＋</button><button data-menu-action="fullscreen">⛶</button></div>
          <button data-menu-action="snapshot">▣ <span>Print / Snapshot</span><kbd>Ctrl+P</kbd></button>
          <button data-menu-action="settings">⚙ <span>Settings</span><span class="menu-arrow">›</span></button>
          <button data-menu-action="exit">⇥ <span>Exit</span></button>
        </div>
        <div class="profile-container">
          <button id="btn-profile-menu" class="profile-button" title="Profiles">👤</button>
          <div id="profile-dropdown" class="profile-dropdown" style="display: none;">
            <div class="profile-dropdown-title">PenS profiles</div>
            <div id="profile-list"></div>
            <button id="btn-add-profile" class="profile-menu-action">＋ Create profile</button>
            <button id="btn-guest-profile" class="profile-menu-action">🕵 Guest profile</button>
            <button id="btn-customize-profile" class="profile-menu-action">✎ Customize profile</button>
            <button id="btn-passwords-profile" class="profile-menu-action">🔑 Passwords and autofill</button>
            <div class="profile-menu-divider"></div>
            <button id="btn-open-settings" class="profile-menu-action">⚙ Settings</button>
          </div>
        </div>
      </div>
    </header>

    <div id="bookmarks-bar" style="display: flex; align-items: center; padding: 4px 8px; background: #f1f3f4; border-bottom: 1px solid #ddd; gap: 8px; font-size: 12px;">
      <button id="btn-add-bookmark" style="padding: 4px; font-size: 12px;">⭐ Bookmark</button>
      <div id="bookmarks-list" style="display: flex; gap: 8px; overflow-x: auto;"></div>
    </div>
    <div id="shields-panel" class="shields-panel" style="display: none;">
      <strong>Privacy Shields</strong>
      <label><input id="shields-enabled" type="checkbox" checked> Block trackers and ads</label>
      <button id="btn-clear-site-data">Clear site data</button>
    </div>

    <!-- Main Content Area -->
    <main id="content-area">
      <!-- The Home Screen is injected dynamically or managed here -->
    </main>

    <!-- Docked Pen Palette (Right Side) -->
    <div id="palette-dock" class="palette-dock minimized unpinned">
      <!-- Minimized Single Icon Trigger -->
      <button id="fp-toggle-btn" class="fp-dock-trigger" title="Pen Tools (Click to open, hover to preview)" aria-label="Open Pen Tools">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
        </svg>
        <span id="fp-color-badge" class="fp-color-badge" style="background-color: #1a73e8;"></span>
      </button>

      <!-- Floating Tool Palette Popup -->
      <div id="floating-palette" class="palette-popup">
        <div id="fp-header">
          <div class="fp-header-title" title="Drag to move the palette">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
            </svg>
            <span>Ink Tools</span>
          </div>
          <div id="new-profile-modal" class="profile-modal" style="display: none;">
            <div class="profile-modal-card">
              <h2>Create profile</h2>
              <input id="modal-profile-name" type="text" maxlength="50" placeholder="Profile name">
              <div class="profile-options">
                <div class="profile-color-opt active" data-color="#1a73e8" style="background:#1a73e8;"></div>
                <div class="profile-color-opt" data-color="#d93025" style="background:#d93025;"></div>
                <div class="profile-color-opt" data-color="#188038" style="background:#188038;"></div>
                <div class="profile-color-opt" data-color="#9334e6" style="background:#9334e6;"></div>
              </div>
              <div class="profile-options">
                <button class="profile-avatar-opt active" data-avatar="👤">👤</button>
                <button class="profile-avatar-opt" data-avatar="🧑‍💻">🧑‍💻</button>
                <button class="profile-avatar-opt" data-avatar="📚">📚</button>
                <button class="profile-avatar-opt" data-avatar="🎨">🎨</button>
              </div>
              <div class="profile-modal-actions">
                <button id="modal-profile-btn-cancel">Cancel</button>
                <button id="modal-profile-btn-create">Create</button>
              </div>
            </div>
          </div>
          <div class="fp-header-actions">
            <button id="fp-btn-pin" class="fp-icon-btn" title="Pin palette open" aria-label="Pin palette">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="17" x2="12" y2="22"></line>
                <path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.89A4 4 0 0 1 14 9V5a1 1 0 0 1 1-1h1V2H8v2h1a1 1 0 0 1 1 1v4a4 4 0 0 1-2.11 3.56l-1.78.89A2 2 0 0 0 5 15.24V17z"></path>
              </svg>
            </button>
            <button id="fp-btn-minimize" class="fp-icon-btn" title="Minimize to icon" aria-label="Minimize palette">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>
        <div class="fp-tools">
          <button id="btn-undo" class="tool-btn" title="Undo (Ctrl+Z)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>
          </button>
          <button id="btn-redo" class="tool-btn" title="Redo (Ctrl+Y)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"></path><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"></path></svg>
          </button>
          <div class="divider"></div>
          <button id="btn-pen" class="tool-btn active" title="Pen (B)">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
          </button>
          <button id="btn-highlighter" class="tool-btn" title="Highlighter (H)">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l-4 4a2.828 2.828 0 0 0 4 4l4-4"></path><path d="M12 9l8-8 3 3-8 8"></path><path d="M14 15l4 4-18 0 0-4"></path></svg>
          </button>
          <button id="btn-eraser" class="tool-btn" title="Eraser (E)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16.51A2 2 0 0 1 19.51 18H5.49A2 2 0 0 1 4 16.51V7.49A2 2 0 0 1 5.49 6h14.02a2 2 0 0 1 2 1.49v9.02z"></path><line x1="9" y1="6" x2="9" y2="18"></line></svg>
          </button>
        </div>
        <div class="fp-divider"></div>
        <div class="fp-section">
          <div class="fp-section-row">
            <span class="fp-label">Stroke Size</span>
            <span id="fp-size-val" class="fp-val-badge">2.5px</span>
          </div>
          <input type="range" id="fp-size" min="1" max="40" value="2.5" step="0.5">
          <div class="fp-section-row fp-opacity-row">
            <span class="fp-label">Opacity</span>
            <span id="fp-opacity-val" class="fp-val-badge">100%</span>
          </div>
          <input type="range" id="fp-opacity" min="10" max="100" value="100" step="5" aria-label="Ink opacity">
        </div>
        <div class="fp-divider"></div>
        <div class="fp-section">
          <span class="fp-label">Colors</span>
          <div id="fp-colors">
            <div class="color-swatch active" style="background-color: #1a73e8;" data-color="#1a73e8"></div>
            <div class="color-swatch" style="background-color: #ea4335;" data-color="#ea4335"></div>
            <div class="color-swatch" style="background-color: #fbbc04;" data-color="#fbbc04"></div>
            <div class="color-swatch" style="background-color: #34a853;" data-color="#34a853"></div>
            <div class="color-swatch" style="background-color: #202124;" data-color="#202124"></div>
            <div class="color-swatch" style="background-color: #ffffff;" data-color="#ffffff"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Unsaved Sketch Decision Modal -->
    <div id="sketch-prompt-modal" class="modal-backdrop" style="display: none;">
      <div class="modal-card">
        <div class="modal-header">
          <div class="modal-badge-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
            </svg>
          </div>
          <div class="modal-title-wrap">
            <h3 class="modal-title">Unsaved Webpage Sketch</h3>
            <p class="modal-subtitle">You have handwritten notes on this webpage. What would you like to do before leaving?</p>
          </div>
        </div>
        <div class="modal-body">
          <div id="modal-page-info" class="modal-page-url"></div>
        </div>
        <div class="modal-footer">
          <button id="modal-btn-cancel" class="modal-btn modal-btn-secondary" title="Stay on this page">Cancel</button>
          <button id="modal-btn-discard" class="modal-btn modal-btn-danger" title="Discard this sketch">Don't Save</button>
          <button id="modal-btn-pdf" class="modal-btn modal-btn-outline" title="Export this page with notes as a PDF document">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
            Export to PDF
          </button>
          <button id="modal-btn-save" class="modal-btn modal-btn-primary" title="Keep notes for this website whenever opened">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
            Save for Next Visit
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="pdf-init.js"></script>
  <script src="ink-engine.js" defer></script>
  <script src="pdf-viewer.js" defer></script>
  <script src="renderer.js" defer></script>
</body>
</html>

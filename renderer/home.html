<div id="home-view" style="display: flex; gap: 20px; padding: 20px; height: 100%; box-sizing: border-box;">
  <!-- Left Column -->
  <div style="flex: 1; display: flex; flex-direction: column; gap: 20px;">
    <div class="card browse-card" style="padding: 40px; text-align: center;">
      <h2 style="font-family: var(--font-sketch); font-size: 2em; margin-bottom: 20px;">Browse</h2>
      <input type="text" id="home-search" placeholder="Search or enter web address..." style="width: 80%; padding: 12px; border-radius: 24px; border: 1px solid var(--border-color); font-size: 16px;">
    </div>
    
    <div class="card bookmarks-card">
      <h3>Bookmarks</h3>
      <div id="home-bookmarks-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px;">
        <!-- Bookmarks injected here -->
      </div>
    </div>
  </div>

  <!-- Right Column -->
  <div style="flex: 1; display: flex; flex-direction: column; gap: 20px;">
    <div class="greeting">
      <h1 style="font-family: var(--font-sketch);">Welcome, <span id="home-profile-name">User</span></h1>
      <p contenteditable="true" id="home-subtitle" style="color: var(--border-color);">How is your day?</p>
    </div>
    
    <div class="card notes-card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3>My notes</h3>
        <a href="#" id="home-see-all-notes" style="color: var(--accent-color); text-decoration: none;">See all</a>
      </div>
      <div id="home-recent-notes" style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
        <!-- Notes injected here -->
      </div>
    </div>
  </div>
</div>
